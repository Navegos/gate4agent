[package]
name = "gate4agent-node-core"
version = "0.5.14"
edition = "2021"
description = "Transport core of the gate4agent node: platform endpoints, spawn profiles, userspace WireGuard"
license = "MIT"

[lib]
name = "gate4agent_node_core"

[dependencies]
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.5.8" }
gate4agent-types = { path = "../gate4agent-types", version = "0.5.8" }
gate4agent-runtime-native = { path = "../gate4agent-runtime-native", version = "0.5.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
smoltcp = { version = "0.11.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Node<->C2 WireGuard. Default: in-process userspace (boringtun+smoltcp).
# Opt-in kernel path on Unix when GATE4AGENT_WG_KERNEL=1.
wireguard = []
